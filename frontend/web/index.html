<!DOCTYPE html>
<html lang="en" translate="no">

<head>
  <meta name="google" content="notranslate">

  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Paax — Stream music for free. Discover, play, and save your favorite tracks.">

  <!-- PWA / theme color — matches manifest.json and Dart AppColors.background -->
  <meta name="theme-color" content="#0c0b10">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="color-scheme" content="dark">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Paax">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>Paax</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Branded loading screen styles.
    The body background is set to #0c0b10 so the user never sees a white flash
    between the OS splash screen and the Flutter engine rendering its first frame.
    A centered logo is shown as a loading indicator and is hidden once Flutter
    takes over the screen.
  -->
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background-color: #0c0b10;
    }

    /* Branded loading indicator — visible while Flutter engine boots */
    .loading-indicator {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #0c0b10;
      z-index: 9999;
      transition: opacity 0.3s ease-out;
    }

    .loading-indicator.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    .loading-indicator img {
      width: 96px;
      height: 96px;
      animation: pulse 1.8s ease-in-out infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 0.4;
        transform: scale(0.92);
      }

      50% {
        opacity: 1;
        transform: scale(1);
      }
    }
  </style>

  <!--
    OFFLINE-FIRST SERVICE WORKER REGISTRATION
    Register our custom cache-first service worker as early as possible,
    BEFORE flutter.js loads. This ensures the app shell is pre-cached on
    the very first visit, so subsequent cold starts (even offline) serve
    the cached UI instead of the TWA offline fallback screen.
  -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker
          .register('custom_service_worker.js', { scope: './' })
          .then(function (reg) {
            console.log('[Paax] Custom SW registered, scope:', reg.scope);
          })
          .catch(function (err) {
            console.warn('[Paax] Custom SW registration failed:', err);
          });
      });
    }
  </script>

  <script>
    // The value below is injected by flutter build, do not touch.
    const serviceWorkerVersion = null;
  </script>
  <!-- This script adds the flutter initialization JS code -->
  <script src="flutter.js" defer></script>
  <script>
    // Polyfill to prevent flutter_inappwebview crash on Web when using mobile plugin
    window.flutter_inappwebview = {
      nativeCommunication: function (method, viewId, args) {
        return Promise.resolve();
      }
    };
  </script>
</head>

<body>
  <!-- Branded loading screen — auto-removed when Flutter's first frame renders -->
  <div id="loading" class="loading-indicator" aria-label="Loading Paax">
    <img src="icons/Icon-192.png" alt="Paax logo">
  </div>

  <script>
    window.addEventListener('load', function (ev) {
      var loading = document.getElementById('loading');

      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: serviceWorkerVersion,
          // Point Flutter's own SW registration at our custom worker.
          // This prevents Flutter from registering a SECOND service worker
          // (flutter_service_worker.js) that would compete with ours.
          serviceWorkerUrl: 'custom_service_worker.js',
        },
        onEntrypointLoaded: function (engineInitializer) {
          engineInitializer.initializeEngine().then(function (appRunner) {
            appRunner.runApp();
            // Fade out and remove the loading indicator once Flutter is running
            if (loading) {
              loading.classList.add('fade-out');
              setTimeout(function () { loading.remove(); }, 350);
            }
          });
        }
      });
    });
  </script>
</body>

</html>
